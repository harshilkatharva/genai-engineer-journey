[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "module-07-embedding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.121.0",
    "fastapi>=0.141.1",
    "google>=3.0.0",
    "google-genai>=2.17.0",
    "ipykernel>=7.3.0",
    "nltk>=3.10.3",
    "numpy>=2.5.2",
    "openai>=3.0.0",
    "pandas>=3.0.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.7.0",
    "tiktoken>=0.13.0",
    "uvicorn>=0.52.1",
]


[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100


[tool.mypy]
python_version = "3.12"
strict = true


