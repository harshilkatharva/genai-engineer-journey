[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "module-20-multi-agent-systems"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "asyncpg>=0.31.0",
    "jinja2>=3.1.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "tiktoken>=0.13.0",
    "uuid>=1.30",
    "anthropic>=0.125.0",
    "google>=3.0.0",
    "google-genai>=2.19.0",
    "openai>=3.3.1",
    "pydantic>=2.13.5",
    "genai-core",
    "module-17-ai-agents",
    "module-18-planning",
    "module-19-reflection",
    "tavily-python>=0.8.5",
]

[tool.uv.sources]
genai-core = { path = "../packages/genai-core", editable = true }
module-17-ai-agents = { path = "../module-17-ai_agents", editable = true }
module-18-planning = {path = "../module-18-planning", editable = true}
module-19-reflection = {path = "../module-19-reflection", editable = true}

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]


markers = [
    "integration: marks tests that call external services"
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "genai_core",
    "genai_core.*",
    "research_and_support_agent",
    "research_and_support_agent.*",
    "plan_and_execute_research_assistant",
    "plan_and_execute_research_assistant.*",
    "self_improving_report_writer",
    "self_improving_report_writer.*",
    "tavily",
    "tavily.*",
]
ignore_missing_imports = true
