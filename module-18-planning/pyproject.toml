[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "module-18-planning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "mcp>=2.2.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx2>=2.10.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sentence-transformers>=5.7.0",
    "tiktoken>=0.13.0",
    "uuid>=1.30",
    "uvicorn>=0.52.3",
    "anthropic>=0.125.0",
    "google>=3.0.0",
    "google-genai>=2.19.0",
    "openai>=3.3.1",
    "pydantic>=2.13.5",
    "langgraph>=1.2.15",
    "langchain-google-genai>=4.4.2",
    "genai-core",
    "module-17-ai-agents",
]

[tool.uv.sources]
genai-core = { path = "../packages/genai-core", editable = true }
module-17-ai-agents = { path = "../module-17-ai_agents", editable = true }

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
]


[tool.ruff]
line-length = 100

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]

markers = [
    "integration : marks tests that call external services"
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "genai_core",
    "genai_core.*",
    "research_and_support_agent",
    "research_and_support_agent.*",
    "bs4",
    "bs4.*",
]
ignore_missing_imports = true
