[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"



[project]
name = "moule-02-softwareeng"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.0",
    "anyio>=4.14.2",
    "asyncio>=4.0.0",
    "dotenv>=0.9.9",
    "google>=3.0.0",
    "google-genai>=2.14.0",
    "httpx>=0.28.1",
    "openai>=2.47.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
