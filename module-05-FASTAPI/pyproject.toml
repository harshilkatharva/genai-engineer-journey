[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"



[project]
name = "module-05-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "anthropic>=0.120.0",
    "anyio>=4.14.2",
    "asyncio>=4.0.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "google>=3.0.0",
    "google-genai>=2.14.0",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "hypothesis>=6.163.0",
    "jinja2>=3.1.6",
    "openai>=2.47.0",
    "slowapi>=0.1.10",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration : marks tests that call external services"
]
addopts = "-m 'not intregration'"

[tool.mypy]
python_version = "3.12"
strict = true

