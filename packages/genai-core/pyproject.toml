[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-core"
version = "0.1.0"
description = "Core GenAI library unifying LLM providers and services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "google-genai>=2.19.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests that hit external live APIs",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
